# name shown as %server% in broadcasts, leave "" to detect it automatically
server-name: "ServerName"

# cache the head skin on join so <hd> head broadcasts show instantly instead of waiting on a download
preload-skins: true

permissions:
  # players with this node skip every platform cooldown
  bypass-cooldown: "aqualive.bypass"

commands:
  # needed to run the announce command and go live
  permission: "aqualive.use"
  # needed for /aqualive help, reload and platforms
  admin-permission: "aqualive.admin"

  # names that trigger the announce command, the first one is the main label
  # applied on /aqualive reload, no restart needed
  aliases:
    - "live"
    - "stream"
    - "directo"
    - "envivo"

# on a proxy, streams sent from these servers are blocked (e.g. auth or limbo)
blacklist-server-send:
  - "auth"

# one block per stream site, the id must match the same block in platforms.yml
# domain = matched against the url | permission = delete the line to allow everyone | cooldown = seconds between uses
platforms:
  kick:
    domain: "kick.com"
    permission: "aqualive.kick"
    cooldown: 120

  twitch:
    domain: "twitch.tv"
    permission: "aqualive.twitch"
    cooldown: 60

  youtube:
    domain: "youtube.com"
    permission: "aqualive.youtube"
    cooldown: 300

  # example, remove the # to add your own platform (copy a block in platforms.yml + webhook.yml too)
  # facebook:
  #   domain: "facebook.com"
  #   permission: "aqualive.facebook"
  #   cooldown: 300
