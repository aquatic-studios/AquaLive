advertisement:
  kick:
    enabled: true
    broadcast:
      chat:
        enabled: true
        layout: "head"
        head:
          skin: "%player%"
          fallback-skin: "c06f8906-4c8a-4911-9c29-ea1dbd1aab82"
          rows:
            - "<hd>"
            - "<hd>  &#38FF35&lKICK"
            - "<hd>"
            - "<hd>  &#38FF35Streamer &7» &f%player%"
            - "<hd>  &#38FF35Link &7» %button_link%"
            - "<hd>  &#38FF35Server &7» %button_server%"
            - "<hd>  &#38FF35Online &7» &#54ADF4%server_online%/%server_max_players%"
            - "<hd>"
        lines:
          - " "
          - "<center>&#38FF35&lKICK</center>"
          - "<center>&#54ADF4%player% &fis now &#38FF35LIVE</center>"
          - "<center>%button_kick%</center>"
          - " "
      sound:
        enabled: true
        id: "ENTITY_PLAYER_LEVELUP"
        volume: 1
        pitch: 1
      title:
        enabled: true
        up: "&#38FF35&lKICK"
        down: "&#54ADF4%player% &fis live on &#38FF35&lKICK"
        fade-in: 500
        stay: 3000
        fade-out: 500
      actionbar:
        enabled: true
        text: "&#38FF35&lKICK &7» &#54ADF4%player% &fis now live"
        duration: 5
      bossbar:
        enabled: true
        text: "&#38FF35&lKICK &7» &#54ADF4%player% &fis now live"
        color: "GREEN"
        style: "PROGRESS"
        progress: 1.0
        duration: 8

  twitch:
    enabled: true
    broadcast:
      chat:
        enabled: true
        layout: "head"
        head:
          skin: "%player%"
          fallback-skin: "c06f8906-4c8a-4911-9c29-ea1dbd1aab82"
          rows:
            - "<hd>"
            - "<hd>  &#9146FF&lTWITCH"
            - "<hd>"
            - "<hd>  &#9146FFStreamer &7» &f%player%"
            - "<hd>  &#9146FFLink &7» %button_link%"
            - "<hd>  &#9146FFServer &7» %button_server%"
            - "<hd>  &#9146FFOnline &7» &#54ADF4%server_online%/%server_max_players%"
            - "<hd>"
        lines:
          - " "
          - "<center>&#9146FF&lTWITCH</center>"
          - "<center>&#54ADF4%player% &fis now &#9146FFLIVE</center>"
          - "<center>%button_twitch%</center>"
          - " "
      sound:
        enabled: true
        id: "ENTITY_PLAYER_LEVELUP"
        volume: 1
        pitch: 1
      title:
        enabled: true
        up: "&#9146FF&lTWITCH"
        down: "&#54ADF4%player% &fis live on &#9146FF&lTWITCH"
        fade-in: 500
        stay: 3000
        fade-out: 500
      actionbar:
        enabled: true
        text: "&#9146FF&lTWITCH &7» &#54ADF4%player% &fis now live"
        duration: 5
      bossbar:
        enabled: true
        text: "&#9146FF&lTWITCH &7» &#54ADF4%player% &fis now live"
        color: "PURPLE"
        style: "PROGRESS"
        progress: 1.0
        duration: 8

