buttons:
  link:
    text: "&#54ADF4(Click to Open)"
    hover:
      - "&fOpen the live stream"
      - "&#54ADF4%url%"
    click:
      type: "url"
      value: "%url%"

  server:
    text: "&#54ADF4%server% &7(Click to join)"
    hover:
      - "&fClick to join this server"
      - "&#54ADF4%server%"
    click:
      type: "server"
      value: "%server%"

  kick:
    text: "&#38FF35[ WATCH ON KICK ]"
    hover:
      - "&fOpen the live stream"
      - "&#38FF35Kick &7» &f%url%"
    click:
      type: "url"
      value: "%url%"

  twitch:
    text: "&#9146FF[ WATCH ON TWITCH ]"
    hover:
      - "&fOpen the live stream"
      - "&#9146FFTwitch &7» &f%url%"
    click:
      type: "url"
      value: "%url%"

  youtube:
    text: "&#FF3B3B[ WATCH ON YOUTUBE ]"
    hover:
      - "&fOpen the live stream"
      - "&#FF3B3BYouTube &7» &f%url%"
    click:
      type: "url"
      value: "%url%"

